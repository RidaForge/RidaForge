
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <rect width="1000" height="240" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="238" rx="15"
        fill="none" stroke="#30363d"/>

  <circle cx="28" cy="27" r="5" fill="#ff6b6b"/>
  <circle cx="46" cy="27" r="5" fill="#f5c451"/>
  <circle cx="64" cy="27" r="5" fill="#55c98b"/>

  <text x="35" y="72" fill="#8b949e"
